services:
  - type: web
    name: yuktifi-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_ENV
        value: production
      - key: SEED_ON_STARTUP
        value: "true"
      - key: CORS_ORIGINS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: yuktifi-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false

databases:
  - name: yuktifi-db
    plan: free
    databaseName: yuktifi
    user: yuktifi_user
