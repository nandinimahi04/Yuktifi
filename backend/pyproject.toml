[project]
name = "yuktifi-backend"
version = "0.1.0"
description = "Yuktifi backend"
requires-python = ">=3.12,<3.13"

dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "sqlalchemy",
    "httpx",
    "numpy",
    "pandas"
]

[tool.vercel]
entrypoint = "app.main:app"