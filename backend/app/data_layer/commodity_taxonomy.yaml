      rice: 0.18
      wheat: 0.12
      atta: 0.10
      tur_dal: 0.15
      sugar: 0.10
      edible_oil: 0.15
      potato: 0.06
      onion: 0.08
      salt: 0.03
      tea: 0.03

  tea_snacks:
    display_name: "Tea & Snacks Shop"
    inputs:
      milk: 0.35
      tea: 0.20
      sugar: 0.12
      atta: 0.10
      edible_oil: 0.12
      potato: 0.08
      onion: 0.03

  dairy:
